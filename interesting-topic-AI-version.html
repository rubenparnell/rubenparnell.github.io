<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brass Bands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 font-['Outfit'] text-slate-900">
    <header class="bg-blue-950 text-white shadow-md">
        <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-4 px-4 py-4 sm:px-6" aria-label="Main navigation">
            <a class="text-xl font-bold tracking-tight text-orange-400" href="index.html">Ruben Parnell</a>
            <ul class="flex flex-wrap items-center gap-x-6 gap-y-2 text-sm font-medium sm:text-base">
                <li><a class="transition hover:text-orange-300" href="index.html">Home</a></li>
                <li><a class="transition hover:text-orange-300" href="interesting-topic.html">Interesting Topic</a></li>
                <li><a class="text-orange-300" href="interesting-topic-AI-version.html" aria-current="page">AI Version</a></li>
            </ul>
        </nav>
    </header>

    <main class="mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:py-16">
        <header class="mb-8 rounded-2xl bg-blue-950 px-6 py-8 shadow-lg sm:px-10">
            <h1 class="text-3xl font-bold tracking-tight text-orange-400 sm:text-4xl">Brass Bands</h1>
            <p class="mt-2 text-blue-100">A few bands and instruments from the brass band world.</p>
        </header>

        <div class="grid gap-6 md:grid-cols-2">
            <section class="rounded-2xl bg-white p-6 shadow-md sm:p-8" aria-labelledby="bands-heading">
                <h2 id="bands-heading" class="text-xl font-semibold text-blue-950 sm:text-2xl">Examples of bands</h2>
                <ol type="I" class="mt-4 list-[upper-roman] space-y-3 pl-6 marker:font-semibold marker:text-orange-600">
                    <li><a class="font-medium text-blue-800 underline decoration-blue-200 underline-offset-4 transition hover:text-orange-600" href="https://www.blackdykeband.co.uk">Black Dyke</a></li>
                    <li><a class="font-medium text-blue-800 underline decoration-blue-200 underline-offset-4 transition hover:text-orange-600" href="https://www.fodensband.co.uk">The Foden's</a></li>
                    <li><a class="font-medium text-blue-800 underline decoration-blue-200 underline-offset-4 transition hover:text-orange-600" href="https://www.flowers.band">Flowers</a></li>
                    <li><a class="font-medium text-blue-800 underline decoration-blue-200 underline-offset-4 transition hover:text-orange-600" href="https://www.coryband.com">Cory</a></li>
                    <li><a class="font-medium text-blue-800 underline decoration-blue-200 underline-offset-4 transition hover:text-orange-600" href="https://www.desfordcollieryband.co.uk">Desford Colliery</a></li>
                </ol>
            </section>

            <section class="rounded-2xl bg-white p-6 shadow-md sm:p-8" aria-labelledby="instruments-heading">
                <h2 id="instruments-heading" class="text-xl font-semibold text-blue-950 sm:text-2xl">Instruments</h2>
                <div class="mt-4 overflow-x-auto">
                    <table class="w-full border-collapse text-left">
                        <thead>
                            <tr class="border-b-2 border-blue-950 text-sm uppercase tracking-wide text-blue-950">
                                <th scope="col" class="px-3 py-3">Instrument</th>
                                <th scope="col" class="px-3 py-3">Image</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200">
                            <tr>
                                <td class="px-3 py-3 font-medium">Cornet</td>
                                <td class="px-3 py-3"><img class="h-auto w-28 rounded-lg object-cover" src="images/cornet.png" alt="Cornet"></td>
                            </tr>
                            <tr>
                                <td class="px-3 py-3 font-medium">Soprano Cornet</td>
                                <td class="px-3 py-3"><img class="h-auto w-28 rounded-lg object-cover" src="images/sop.jpg" alt="Soprano cornet"></td>
                            </tr>
                            <tr>
                                <td class="px-3 py-3 font-medium">Tenor Horn</td>
                                <td class="px-3 py-3"><img class="h-auto w-28 rounded-lg object-cover" src="images/horn.jpg" alt="Tenor horn"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</body>    
</html>
